version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.11.9
  command: uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  env:
    - name: OPENAI_VLM_MODEL
      value: gpt-5.6-sol
    # AIDEV-NOTE: OPENAI_API_KEY 와 VLM_SERVICE_TOKEN 은 여기에 절대 적지 않는다.
    #             이 파일은 깃에 커밋되므로 App Runner 콘솔 > Configuration >
    #             Environment 에서 Secrets Manager 또는 SSM 참조로 주입한다.
