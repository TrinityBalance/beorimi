version: 1
applications:
  # 모노레포이므로 appRoot로 프론트 디렉터리를 지정한다.
  # Amplify 콘솔에서 앱을 연결할 때 이 파일이 자동으로 감지된다.
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci
            - test -n "$NEXT_PUBLIC_API_BASE_URL"
            - test -n "$NEXT_PUBLIC_COGNITO_USER_POOL_ID"
            - test -n "$NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID"
        build:
          commands:
            # NEXT_PUBLIC_* 는 빌드 시점에 번들에 포함되므로
            # API Gateway와 Cognito의 공개 설정을 Amplify 환경 변수에 등록해야 한다.
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
