AWSTemplateFormatVersion: "2010-09-09"
Description: Beorimi Backend on AWS Lambda Function URL

Parameters:
  ArtifactBucket:
    Type: String
  BackendArtifactKey:
    Type: String
  VlmBaseUrl:
    Type: String
  ServiceTokenSecretArn:
    Type: String
  FrontendOrigin:
    Type: String
    Default: https://example.invalid

Resources:
  BackendExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  BackendFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: beorimi-backend
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: app.main.handler
      Role: !GetAtt BackendExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref BackendArtifactKey
      MemorySize: 512
      Timeout: 150
      Environment:
        Variables:
          APP_NAME: Beorimi API
          VLM_BASE_URL: !Ref VlmBaseUrl
          VLM_SERVICE_TOKEN: !Sub "{{resolve:secretsmanager:${ServiceTokenSecretArn}:SecretString}}"
          VLM_TIMEOUT_SECONDS: "125"
          # AIDEV-NOTE: Keep raw uploads at 4MiB so base64 Lambda events stay below the 6MB Function URL request quota.
          MAX_UPLOAD_BYTES: "4194304"
          CORS_ALLOW_ORIGINS: !Ref FrontendOrigin

  BackendFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt BackendFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  BackendFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Principal: "*"
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

  BackendFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Principal: "*"
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true

Outputs:
  BackendUrl:
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
  ExecutionRoleArn:
    Value: !GetAtt BackendExecutionRole.Arn

