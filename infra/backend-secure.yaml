AWSTemplateFormatVersion: "2010-09-09"
Description: Secure and asynchronous Beorimi Backend on AWS

Parameters:
  ArtifactBucket:
    Type: String
  BackendArtifactKey:
    Type: String
  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
  VlmBaseUrl:
    Type: String
  VlmServiceTokenSecretArn:
    Type: String
  AnalysisRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
  MaxSourceImageBytes:
    Type: Number
    Default: 10485760
    MinValue: 1
    MaxValue: 10485760

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: beorimi-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: beorimi-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  ImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - Content-Type
            AllowedMethods:
              - POST
            AllowedOrigins:
              - !Ref FrontendOrigin
            ExposedHeaders:
              - ETag
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: expire-source-images
            Status: Enabled
            ExpirationInDays: !Ref AnalysisRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      VersioningConfiguration:
        Status: Enabled

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ImageBucket.Arn
              - !Sub "${ImageBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  AnalysisTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  AnalysisDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 900
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDeadLetterQueue.Arn
        maxReceiveCount: 3

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/beorimi-api-secure
      RetentionInDays: 14

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/beorimi-analysis-worker
      RetentionInDays: 14

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: beorimi-api-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ApiLogGroup.Arn}:*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${ImageBucket.Arn}/waste-images/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AnalysisTable.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt AnalysisQueue.Arn

  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: beorimi-worker-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${WorkerLogGroup.Arn}:*"
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt AnalysisTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ImageBucket.Arn}/waste-images/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt AnalysisQueue.Arn

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: beorimi-api-secure
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: app.main.handler
      Role: !GetAtt ApiExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref BackendArtifactKey
      MemorySize: 512
      Timeout: 29
      Environment:
        Variables:
          APP_NAME: Beorimi API
          IMAGE_BUCKET_NAME: !Ref ImageBucket
          ANALYSIS_TABLE_NAME: !Ref AnalysisTable
          ANALYSIS_QUEUE_URL: !Ref AnalysisQueue
          PRESIGNED_URL_TTL_SECONDS: "300"
          MAX_SOURCE_IMAGE_BYTES: !Ref MaxSourceImageBytes
          ANALYSIS_RETENTION_DAYS: !Ref AnalysisRetentionDays
          CORS_ALLOW_ORIGINS: !Ref FrontendOrigin

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: beorimi-analysis-worker
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: app.workers.analysis.handler
      Role: !GetAtt WorkerExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref BackendArtifactKey
      MemorySize: 512
      Timeout: 150
      Environment:
        Variables:
          ANALYSIS_TABLE_NAME: !Ref AnalysisTable
          ANALYSIS_MAX_RECEIVE_COUNT: "3"
          IMAGE_BUCKET_NAME: !Ref ImageBucket
          MAX_SOURCE_IMAGE_BYTES: !Ref MaxSourceImageBytes
          VLM_BASE_URL: !Ref VlmBaseUrl
          VLM_SERVICE_TOKEN: !Sub "{{resolve:secretsmanager:${VlmServiceTokenSecretArn}:SecretString}}"
          VLM_TIMEOUT_SECONDS: "110"

  WorkerEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AnalysisQueue.Arn
      FunctionName: !Ref WorkerFunction
      BatchSize: 1
      Enabled: true
      FunctionResponseTypes:
        - ReportBatchItemFailures

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: beorimi-secure-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowCredentials: false
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - !Ref FrontendOrigin
        MaxAge: 300

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: beorimi-cognito
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/health
      AuthorizationType: NONE
      Target: !Sub "integrations/${ApiIntegration}"

  CreateUploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/uploads
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - aws.cognito.signin.user.admin
      Target: !Sub "integrations/${ApiIntegration}"

  CreateAnalysisRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/analyses
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - aws.cognito.signin.user.admin
      Target: !Sub "integrations/${ApiIntegration}"

  GetAnalysisRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/analyses/{analysis_id}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - aws.cognito.signin.user.admin
      Target: !Sub "integrations/${ApiIntegration}"

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ImageBucketName:
    Value: !Ref ImageBucket
  AnalysisTableName:
    Value: !Ref AnalysisTable
  AnalysisQueueUrl:
    Value: !Ref AnalysisQueue
